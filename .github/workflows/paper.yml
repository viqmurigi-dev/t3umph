name: paper-trader

on:
  schedule:
    - cron: "*/5 * * * *"          # wake every 5 min; gate.py decides if the bot is needed
  workflow_dispatch:
    inputs:
      test_minutes:
        description: "Test: run the bot for this many minutes right now (leave empty for normal)"
        required: false
        default: ""

concurrency:
  group: paper-trader
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Is the bot needed now?
        id: gate
        env:
          FORCE_MIN: ${{ github.event.inputs.test_minutes }}
        run: python3 gate.py

      - name: Run the paper trader
        id: bot
        if: steps.gate.outputs.run == 'true'
        env:
          NTFY: ${{ secrets.NTFY_TOPIC }}
        run: |
          timeout -s INT ${{ steps.gate.outputs.secs }} python3 -u paper_news.py run rest=1 ntfy="$NTFY" &
          bot=$!
          while kill -0 "$bot" 2>/dev/null; do          # save the account every 3 minutes while the bot runs, so a cancelled or crashed run never loses a trade
            for i in $(seq 1 18); do kill -0 "$bot" 2>/dev/null || break; sleep 10; done
            if kill -0 "$bot" 2>/dev/null; then bash save_state.sh || true; fi
          done
          rc=0
          wait "$bot" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Save the account (state, trades, logs)
        if: always() && steps.gate.outputs.run == 'true'
        run: bash save_state.sh

      - name: Carry on in a new run when this one hit its time limit
        if: always() && steps.gate.outputs.run == 'true' && steps.bot.outputs.rc == '124' && github.event.inputs.test_minutes == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run paper.yml --ref "${{ github.ref_name }}"
