name: paper-trader

on:
  schedule:
    - cron: "*/15 * * * *"        # wake every 15 min; gate.py decides if the bot is needed
  workflow_dispatch:
    inputs:
      test_minutes:
        description: "Test: run the bot for this many minutes right now (leave empty for normal)"
        required: false
        default: ""

concurrency:
  group: paper-trader
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run: |
  git config user.name "paper-trader"
  git config user.email "paper-trader@users.noreply.github.com"
  for f in paper_news_state.json paper_news_trades.csv paper_news_daily.csv paper_news_rebates.csv paper_news_daily.log paper_news_rebates.log paper_news.log calendar_cache.json; do
    [ -f "$f" ] && git add -f "$f"
  done
  git diff --cached --quiet || git commit -m "paper trader state $(date -u +%F_%H:%M)"
  for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
